name: Release macOS

# Builds the universal DMG and publishes it as a GitHub release.
#
# Two ways to cut a release, both from a commit whose package.json version
# (and brain.py __version__, kept in sync by `npm run test:public`) is the
# version being shipped:
#   - push the tag `v<version>` at that commit, or
#   - run this workflow manually on `main` (Actions tab or API); the run
#     then creates the tag `v<version>` itself when it publishes the
#     release. This covers release engineering from an environment that
#     may merge pull requests but cannot push tags.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    # Manual releases are cut from main only; a tag push carries its own ref.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Resolve the release tag from package.json
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the package.json version ($tag)"
              exit 1
            fi
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag is already released; bump the version in package.json and brain.py first"
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run test:python
      - run: npm test
      - run: npm run test:visual -- --ignore-snapshots
      - run: npm audit --omit=dev
      - run: npm run test:public
      - run: npm run make:universal
      - run: npm run test:package -- "out/Agent Brain-darwin-universal/Agent Brain.app"
      - name: Verify macOS artifact
        run: |
          test "$(lipo -archs 'out/Agent Brain-darwin-universal/Agent Brain.app/Contents/MacOS/Agent Brain')" = "x86_64 arm64"
          codesign --verify --deep --strict "out/Agent Brain-darwin-universal/Agent Brain.app"
          hdiutil verify "out/make/Agent Brain.dmg"
          "out/Agent Brain-darwin-universal/Agent Brain.app/Contents/Resources/python-arm64/python/bin/python3" --version
          arch -x86_64 "out/Agent Brain-darwin-universal/Agent Brain.app/Contents/Resources/python-x64/python/bin/python3" --version
      - name: Fresh-profile application smoke
        run: |
          AGENT_BRAIN_HOME="$RUNNER_TEMP/agent-brain-smoke" AGENT_BRAIN_SMOKE_SCREENSHOT="$RUNNER_TEMP/agent-brain-smoke.png" "out/Agent Brain-darwin-universal/Agent Brain.app/Contents/MacOS/Agent Brain"
          test -s "$RUNNER_TEMP/agent-brain-smoke.png"
          codesign --verify --deep --strict "out/Agent Brain-darwin-universal/Agent Brain.app"
      - name: Create checksum
        run: |
          cd out/make
          shasum -a 256 "Agent Brain.dmg" > SHA256SUMS
          shasum -c SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: agent-brain-macos-universal
          path: |
            out/make/Agent Brain.dmg
            out/make/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: agent-brain-macos-universal
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # Tag push: the tag exists, refuse to publish against a missing one.
          # Manual run: GitHub creates the tag at the built commit on publish.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            set -- --verify-tag
          else
            set -- --target "$GITHUB_SHA"
          fi
          gh release create "$TAG" "release/Agent Brain.dmg#Agent Brain.dmg" "release/SHA256SUMS#SHA256SUMS" --generate-notes "$@"
