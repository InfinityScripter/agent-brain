name: Release macOS

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag matches package version
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run test:python
      - run: npm test
      - run: npm run test:visual -- --ignore-snapshots
      - run: npm audit --omit=dev
      - run: npm run test:public
      - run: npm run make:universal
      - run: npm run test:package -- "out/Agent Brain-darwin-universal/Agent Brain.app"
      - name: Verify macOS artifact
        run: |
          test "$(lipo -archs 'out/Agent Brain-darwin-universal/Agent Brain.app/Contents/MacOS/Agent Brain')" = "x86_64 arm64"
          codesign --verify --deep --strict "out/Agent Brain-darwin-universal/Agent Brain.app"
          hdiutil verify "out/make/Agent Brain.dmg"
          "out/Agent Brain-darwin-universal/Agent Brain.app/Contents/Resources/python-arm64/python/bin/python3" --version
          arch -x86_64 "out/Agent Brain-darwin-universal/Agent Brain.app/Contents/Resources/python-x64/python/bin/python3" --version
      - name: Fresh-profile application smoke
        run: |
          AGENT_BRAIN_HOME="$RUNNER_TEMP/agent-brain-smoke" AGENT_BRAIN_SMOKE_SCREENSHOT="$RUNNER_TEMP/agent-brain-smoke.png" "out/Agent Brain-darwin-universal/Agent Brain.app/Contents/MacOS/Agent Brain"
          test -s "$RUNNER_TEMP/agent-brain-smoke.png"
          codesign --verify --deep --strict "out/Agent Brain-darwin-universal/Agent Brain.app"
      - name: Create checksum
        run: |
          cd out/make
          shasum -a 256 "Agent Brain.dmg" > SHA256SUMS
          shasum -c SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: agent-brain-macos-universal
          path: |
            out/make/Agent Brain.dmg
            out/make/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agent-brain-macos-universal
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" "release/Agent Brain.dmg#Agent Brain.dmg" "release/SHA256SUMS#SHA256SUMS" --generate-notes --verify-tag
