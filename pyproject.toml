# Lint configuration for the Python engine. The project is intentionally a
# single-file engine (brain.py) plus its test suite; there is no build step
# and nothing here is packaged for PyPI.

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "F",   # pyflakes: real errors (undefined names, unused imports)
    "E4",  # pycodestyle: import placement
    "E7",  # pycodestyle: statement errors
    "E9",  # pycodestyle: syntax errors
    "W",   # pycodestyle: warnings (trailing whitespace, ...)
    "B",   # bugbear: likely bugs and design problems
    "PLE", # pylint errors
    "PLW", # pylint warnings
    "RUF", # ruff-native checks
]
ignore = [
    # The engine keeps a handful of compact one-line guards; readability is
    # reviewed by humans, not enforced by the linter.
    "E701",
    # Module-level state (REGISTRY_DIR and friends) is reconfigured through
    # configure_paths(); the globals are the documented design.
    "PLW0603",
    # Loop variables are intentionally re-sorted in place in merge_skills().
    "PLW2901",
]

[tool.ruff.lint.per-file-ignores]
# Tests use unittest idioms and fixture classes with shared class attributes.
"tests/*" = ["RUF012"]
